<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Facial Musculature — Interactive 3D</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --panel-bg: rgba(15, 15, 25, 0.95);
      --accent: #5e9bff;
      --text: #e0e6ff;
      --text-dim: #8090b0;
      --border: rgba(94, 155, 255, 0.25);
      --highlight: #ffe066;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    /* ── Loading Overlay ── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    .spinner {
      width: 56px; height: 56px;
      border: 3px solid rgba(94,155,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      font-size: 14px; color: var(--text-dim);
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    /* ── Canvas ── */
    #canvas {
      position: fixed; inset: 0;
      width: 100% !important; height: 100% !important;
      display: block;
    }

    /* ── Title Bar ── */
    #title-bar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 24px 10px;
      background: linear-gradient(180deg, rgba(10,10,20,0.97) 60%, transparent);
      z-index: 10;
      pointer-events: none;
    }
    #title-bar h1 {
      font-size: 20px; font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow: 0 0 20px rgba(94,155,255,0.6);
    }
    #title-bar p {
      font-size: 12px; color: var(--text-dim);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Info Panel ── */
    #info-panel {
      position: fixed; bottom: 24px; right: 24px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0;
      z-index: 20;
      overflow: hidden;
      transform: translateX(360px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    }
    #info-panel.visible {
      transform: translateX(0);
      opacity: 1;
    }

    #info-panel-header {
      padding: 14px 16px 12px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    #muscle-color-swatch {
      width: 14px; height: 14px; border-radius: 50%;
      flex-shrink: 0; box-shadow: 0 0 8px currentColor;
    }
    #muscle-name {
      font-size: 16px; font-weight: 700;
      color: #fff; line-height: 1.2;
    }

    #info-panel-body {
      padding: 14px 16px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .info-row { display: flex; flex-direction: column; gap: 3px; }
    .info-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); opacity: 0.8;
    }
    .info-value {
      font-size: 13px; color: var(--text);
      line-height: 1.5;
    }
    .info-value.expressions {
      font-style: italic; color: var(--highlight); opacity: 0.9;
    }

    /* ── Legend ── */
    #legend {
      position: fixed; top: 80px; left: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      z-index: 10;
      min-width: 180px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #legend h3 {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; cursor: pointer;
      transition: opacity 0.2s;
    }
    .legend-item:hover { opacity: 0.75; }
    .legend-swatch {
      width: 10px; height: 10px; border-radius: 3px;
      flex-shrink: 0;
    }
    .legend-text {
      font-size: 11px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 140px;
    }
    .legend-separator {
      height: 1px; background: var(--border);
      margin: 6px 0;
    }
    .legend-category {
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); opacity: 0.6;
      margin: 4px 0 2px;
    }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,20,0.8);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 12px; color: var(--text-dim);
      letter-spacing: 0.06em;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.5s;
      backdrop-filter: blur(6px);
    }
    #hint.hidden { opacity: 0; }

    /* ── Controls hint ── */
    #controls-hint {
      position: fixed; bottom: 62px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 16px;
      font-size: 11px; color: var(--text-dim);
      opacity: 0.6;
      z-index: 10;
      pointer-events: none;
    }
    .ctrl { display: flex; align-items: center; gap: 5px; }
    .ctrl kbd {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 1px 6px; font-size: 10px;
    }

    /* ── Close button ── */
    #info-close {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none;
      color: var(--text-dim); cursor: pointer;
      font-size: 18px; line-height: 1;
      padding: 2px 6px; border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }
    #info-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p>Loading 3D model&hellip;</p>
</div>

<!-- Title -->
<div id="title-bar">
  <h1>Human Facial Musculature</h1>
  <p>Interactive 3D Anatomy — Click any muscle to explore</p>
</div>

<!-- Canvas (Three.js target) -->
<canvas id="canvas"></canvas>

<!-- Info Panel -->
<div id="info-panel">
  <button id="info-close" title="Close">&times;</button>
  <div id="info-panel-header">
    <span id="muscle-color-swatch"></span>
    <span id="muscle-name">—</span>
  </div>
  <div id="info-panel-body">
    <div class="info-row">
      <span class="info-label">Origin</span>
      <span class="info-value" id="info-origin">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Insertion</span>
      <span class="info-value" id="info-insertion">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Function</span>
      <span class="info-value" id="info-function">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Expressions</span>
      <span class="info-value expressions" id="info-expressions">—</span>
    </div>
  </div>
</div>

<!-- Legend -->
<div id="legend">
  <h3>Muscle Groups</h3>
  <div id="legend-items"></div>
</div>

<!-- Hint -->
<div id="hint">Click a muscle to learn more</div>

<!-- Controls hint -->
<div id="controls-hint">
  <div class="ctrl"><kbd>Drag</kbd> Rotate</div>
  <div class="ctrl"><kbd>Scroll</kbd> Zoom</div>
  <div class="ctrl"><kbd>Right-drag</kbd> Pan</div>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls for r128 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
'use strict';

// ════════════════════════════════════════════════════
//  MUSCLE DATA DICTIONARY
// ════════════════════════════════════════════════════
const MUSCLES = {

    function: "Elevates (closes) mandible, retracts mandible",
    expressions: "Chewing, clenching jaw, grinding teeth",
    color: 0x27ae60,
    category: "Jaw"
  },
  masseter_L: {
    name: "Masseter (L)",
    origin: "Zygomatic arch and maxillary process of zygomatic bone",
    insertion: "Lateral surface of ramus of mandible",
    function: "Elevates mandible (closes jaw), assists protrusion",
    expressions: "Chewing, clenching, grinding",
    color: 0x2ecc71,
    category: "Jaw"
  },
  masseter_R: {
    name: "Masseter (R)",
    origin: "Zygomatic arch and maxillary process of zygomatic bone",
    insertion: "Lateral surface of ramus of mandible",
    function: "Elevates mandible (closes jaw), assists protrusion",
    expressions: "Chewing, clenching, grinding",
    color: 0x2ecc71,
    category: "Jaw"
  },
  zygomaticusMajor_L: {
    name: "Zygomaticus Major (L)",
    origin: "Zygomatic bone, lateral surface",
    insertion: "Modiolus at corner of mouth",
    function: "Draws corner of mouth upward and laterally",
    expressions: "Smiling, laughing, happiness",
    color: 0xf39c12,
    category: "Cheek"
  },
  zygomaticusMajor_R: {
    name: "Zygomaticus Major (R)",
    origin: "Zygomatic bone, lateral surface",
    insertion: "Modiolus at corner of mouth",
    function: "Draws corner of mouth upward and laterally",
    expressions: "Smiling, laughing, happiness",
    color: 0xf39c12,
    category: "Cheek"
  },
  zygomaticusMinor_L: {
    name: "Zygomaticus Minor (L)",
    origin: "Zygomatic bone, medial surface",
    insertion: "Upper lip (orbicularis oris)",
    function: "Raises upper lip, deepens nasolabial furrow",
    expressions: "Sad smile, contempt, sneering",
    color: 0xe67e22,
    category: "Cheek"
  },
  zygomaticusMinor_R: {
    name: "Zygomaticus Minor (R)",
    origin: "Zygomatic bone, medial surface",

    function: "Raises upper lip, deepens nasolabial furrow",

    color: 0xe67e22,
    category: "Cheek"
  },
  buccinator_L: {

    color: 0x1abc9c,
    category: "Cheek"
  },
  buccinator_R: {
    name: "Buccinator (R)",
    origin: "Alveolar processes of maxilla and mandible, pterygomandibular raphe",
    insertion: "Modiolus, blending with orbicularis oris",
    function: "Compresses cheeks against teeth, aids chewing",
    expressions: "Chewing, blowing, whistling, sucking",
    color: 0x1abc9c,
    category: "Cheek"
  },
  risorius_L: {
    name: "Risorius (L)",
    origin: "Parotid fascia and platysma",
    insertion: "Modiolus and skin at corner of mouth",
    function: "Retracts corner of mouth laterally",
    expressions: "Grinning, grimacing, forced smile",
    color: 0x16a085,

  },
  risorius_R: {
    name: "Risorius (R)",
    origin: "Parotid fascia and platysma",
    insertion: "Modiolus and skin at corner of mouth",
    function: "Retracts corner of mouth laterally",
    expressions: "Grinning, grimacing, forced smile",
    color: 0x16a085,
    category: "Cheek"
  },
  levatorLabiiSuperioris_L: {
    name: "Levator Labii Superioris (L)",
    origin: "Infraorbital margin of maxilla",
    insertion: "Skin of upper lip and alar cartilage of nose",
    function: "Elevates upper lip, dilates nostril",
    expressions: "Disgust, sadness, sneer, showing upper teeth",
    color: 0xd35400,
    category: "Lips"
  },
  levatorLabiiSuperioris_R: {
    name: "Levator Labii Superioris (R)",
    origin: "Infraorbital margin of maxilla",
    insertion: "Skin of upper lip and alar cartilage of nose",
    function: "Elevates upper lip, dilates nostril",
    expressions: "Disgust, sadness, sneer, showing upper teeth",
    color: 0xd35400,
    category: "Lips"
  },
  orbicularisOris: {
    name: "Orbicularis Oris",
    origin: "Maxilla (incisive fossa), mandible, modiolus",

    function: "Closes and protrudes lips, shapes for speech",
    expressions: "Kissing, whistling, pouting, speech",

  depressorLabiiInferioris_L: {

    function: "Depresses and everts lower lip",

    color: 0x8e44ad,
    category: "Lips"
  },
  depressorLabiiInferioris_R: {
    name: "Depressor Labii Inferioris (R)",
    origin: "Anterolateral surface of mandible",
    insertion: "Skin of lower lip and orbicularis oris",
    function: "Depresses and everts lower lip",
    expressions: "Sadness, doubt, irony, showing lower teeth",
    color: 0x8e44ad,
    category: "Lips"
  },
  mentalis: {
    name: "Mentalis",
    origin: "Incisive fossa of mandible",
    insertion: "Skin of chin",
    function: "Elevates chin skin, protrudes lower lip",
    expressions: "Pouting, doubt, determination, drinking",
    color: 0x6c3483,
    category: "Chin"
  }
};

// ════════════════════════════════════════════════════
//  LEGEND CATEGORIES & ORDER
// ════════════════════════════════════════════════════
const CATEGORIES = ["Forehead", "Eye", "Nose", "Jaw", "Cheek", "Lips", "Chin"];
const CATEGORY_COLORS = {
  "Forehead": "#e74c3c", "Eye": "#3498db", "Nose": "#9b59b6",
  "Jaw": "#27ae60", "Cheek": "#f39c12", "Lips": "#e91e8c", "Chin": "#6c3483"
};

// ════════════════════════════════════════════════════
//  BUILD LEGEND
// ════════════════════════════════════════════════════
(function buildLegend() {
  const container = document.getElementById('legend-items');
  CATEGORIES.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'legend-category';
    catDiv.textContent = cat;
    container.appendChild(catDiv);

    Object.entries(MUSCLES).forEach(([key, m]) => {
      if (m.category !== cat) return;
      // Only show each unique name once in legend
      const shortName = m.name.replace(' (L)', '').replace(' (R)', '');
      // Deduplicate by name
      const existing = container.querySelector(`[data-name="${shortName}"]`);
      if (existing) return;

      const item = document.createElement('div');
      item.className = 'legend-item';
      item.setAttribute('data-name', shortName);
      item.innerHTML = `
        <div class="legend-swatch" style="background:#${m.color.toString(16).padStart(6,'0')}"></div>
        <span class="legend-text">${shortName}</span>
      `;
      container.appendChild(item);
    });

    const sep = document.createElement('div');
    sep.className = 'legend-separator';
    container.appendChild(sep);
  });
})();

// ════════════════════════════════════════════════════
//  THREE.JS SCENE SETUP
// ════════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 3.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.8;
controls.maxDistance = 7;
controls.target.set(0, 0.1, 0);
controls.update();

// ── Lights ──
const ambient = new THREE.AmbientLight(0x223355, 0.8);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffeedd, 1.4);
keyLight.position.set(2, 3, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
fillLight.position.set(-3, 1, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
rimLight.position.set(0, -2, -3);
scene.add(rimLight);

const topLight = new THREE.PointLight(0xaabbff, 0.4, 10);
topLight.position.set(0, 4, 0);
scene.add(topLight);

// ════════════════════════════════════════════════════
//  HEAD MODEL (Primitives)
// ════════════════════════════════════════════════════
const headGroup = new THREE.Group();
scene.add(headGroup);

const skinColor = 0xd4956a;
const skinMat = new THREE.MeshPhongMaterial({
  color: skinColor,
  specular: 0x442211,
  shininess: 18,
  side: THREE.FrontSide
});

// — Skull (main cranium) —
const skullGeo = new THREE.SphereGeometry(1, 64, 48);
const skull = new THREE.Mesh(skullGeo, skinMat);
skull.scale.set(0.88, 1.08, 0.96);
skull.castShadow = true;
skull.receiveShadow = true;
headGroup.add(skull);

// — Forehead bulge —
const foreheadGeo = new THREE.SphereGeometry(0.6, 32, 24);
const forehead = new THREE.Mesh(foreheadGeo, skinMat);
forehead.scale.set(1.1, 0.7, 0.55);
forehead.position.set(0, 0.65, 0.52);
headGroup.add(forehead);

// — Jaw / lower face —
const jawGeo = new THREE.SphereGeometry(0.72, 48, 32);
const jaw = new THREE.Mesh(jawGeo, skinMat);
jaw.scale.set(0.82, 0.62, 0.82);
jaw.position.set(0, -0.72, 0.08);
headGroup.add(jaw);

// — Cheekbones (L & R) —
[-1, 1].forEach(side => {
  const ckGeo = new THREE.SphereGeometry(0.28, 24, 18);
  const ck = new THREE.Mesh(ckGeo, skinMat);
  ck.scale.set(1.1, 0.65, 0.7);
  ck.position.set(side * 0.72, -0.05, 0.55);
  headGroup.add(ck);
});

// — Nose —
const noseBaseGeo = new THREE.SphereGeometry(0.16, 20, 16);
const noseBase = new THREE.Mesh(noseBaseGeo, skinMat);
noseBase.scale.set(0.9, 0.7, 1.1);
noseBase.position.set(0, 0.05, 0.92);
headGroup.add(noseBase);

const noseBridgeGeo = new THREE.CylinderGeometry(0.045, 0.085, 0.38, 16);
const noseBridge = new THREE.Mesh(noseBridgeGeo, skinMat);

const muscleMeshes = []; // all clickable muscle meshes
const muscleMap = new Map(); // mesh uuid → muscle key

function makeMat(hexColor, opacity = 0.78) {
  return new THREE.MeshPhongMaterial({
    color: hexColor,
    emissive: new THREE.Color(hexColor).multiplyScalar(0.12),
    specular: 0x222222,
    shininess: 14,
    transparent: true,
    opacity: opacity,
    side: THREE.FrontSide,
    depthWrite: false
  });
}

function addMuscle(key, geo, mat, position, scale, rotation) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  if (scale) mesh.scale.copy(scale);
  if (rotation) {
    mesh.rotation.x = rotation.x || 0;
    mesh.rotation.y = rotation.y || 0;
    mesh.rotation.z = rotation.z || 0;
  }
  mesh.userData.muscleKey = key;
  mesh.userData.originalColor = mat.color.getHex();
  mesh.userData.originalEmissive = mat.emissive.getHex();
  mesh.userData.originalOpacity = opacity;
  headGroup.add(mesh);
  muscleMeshes.push(mesh);
  muscleMap.set(mesh.uuid, key);
  return mesh;
}

//  RAYCASTING & INTERACTION
// ════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null;
let selectedMesh = null;
let isDragging = false;
let mouseDownPos = { x: 0, y: 0 };

function hexToCSS(hex) {
  return '#' + hex.toString(16).padStart(6, '0');
}

function highlightMesh(mesh, type) {
  // type: 'hover' | 'select' | 'none'
  if (!mesh) return;
  const mat = mesh.material;
  if (type === 'select') {
    mat.color.setHex(0xffee44);
    mat.emissive.setHex(0x885500);
    mat.opacity = 0.92;
  } else if (type === 'hover') {
    const orig = new THREE.Color(mesh.userData.originalColor);
    mat.color.copy(orig.clone().lerp(new THREE.Color(0xffffff), 0.28));
    mat.emissive.setHex(mesh.userData.originalColor).multiplyScalar(0.3);
    mat.opacity = 0.88;
  } else {
    mat.color.setHex(mesh.userData.originalColor);
    const orig = new THREE.Color(mesh.userData.originalColor);
    mat.emissive.copy(orig.clone().multiplyScalar(0.12));
    mat.opacity = mesh.userData.originalOpacity !== undefined ? mesh.userData.originalOpacity : 0.78;
  }
}

function resetMesh(mesh) {
  if (!mesh) return;
  const mat = mesh.material;
  mat.color.setHex(mesh.userData.originalColor);
  const orig = new THREE.Color(mesh.userData.originalColor);
  mat.emissive.copy(orig.clone().multiplyScalar(0.12));
  mat.opacity = 0.78;
}

// Info Panel
const infoPanel = document.getElementById('info-panel');
const muscleNameEl = document.getElementById('muscle-name');
const muscleSwatchEl = document.getElementById('muscle-color-swatch');
const infoOrigin = document.getElementById('info-origin');
const infoInsertion = document.getElementById('info-insertion');
const infoFunction = document.getElementById('info-function');
const infoExpressions = document.getElementById('info-expressions');
const hintEl = document.getElementById('hint');

function showInfo(key) {
  const m = MUSCLES[key];
  if (!m) return;
  muscleNameEl.textContent = m.name;
  const cssColor = hexToCSS(m.color);
  muscleSwatchEl.style.background = cssColor;
  muscleSwatchEl.style.boxShadow = `0 0 8px ${cssColor}`;
  infoOrigin.textContent = m.origin;
  infoInsertion.textContent = m.insertion;
  infoFunction.textContent = m.function;
  infoExpressions.textContent = m.expressions;
  infoPanel.classList.add('visible');
  hintEl.classList.add('hidden');
}

function hideInfo() {
  infoPanel.classList.remove('visible');
  setTimeout(() => { hintEl.classList.remove('hidden'); }, 800);
}

document.getElementById('info-close').addEventListener('click', () => {
  hideInfo();
  if (selectedMesh) {
    resetMesh(selectedMesh);
    selectedMesh = null;
  }
});

// Mouse events
renderer.domElement.addEventListener('mousedown', e => {
  mouseDownPos.x = e.clientX;
  mouseDownPos.y = e.clientY;
  isDragging = false;
});

renderer.domElement.addEventListener('mousemove', e => {
  const dx = e.clientX - mouseDownPos.x;
  const dy = e.clientY - mouseDownPos.y;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) isDragging = true;

  // Update mouse for raycasting
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(muscleMeshes);
  const hit = hits.length > 0 ? hits[0].object : null;

  if (hit !== hoveredMesh) {
    // Restore previous hover
    if (hoveredMesh && hoveredMesh !== selectedMesh) {
      resetMesh(hoveredMesh);
    }
    hoveredMesh = hit;
    if (hoveredMesh && hoveredMesh !== selectedMesh) {
      highlightMesh(hoveredMesh, 'hover');
    }
    renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  }
});

renderer.domElement.addEventListener('mouseup', e => {
  if (isDragging) return;
  const dx = e.clientX - mouseDownPos.x;
  const dy = e.clientY - mouseDownPos.y;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(muscleMeshes);

  // Deselect previous
  if (selectedMesh) {
    resetMesh(selectedMesh);
    selectedMesh = null;
  }

  if (hits.length > 0) {
    const mesh = hits[0].object;
    selectedMesh = mesh;
    highlightMesh(mesh, 'select');
    showInfo(mesh.userData.muscleKey);
  } else {
    hideInfo();
  }
});

// Touch support
renderer.domElement.addEventListener('touchend', e => {
  if (e.changedTouches.length === 0) return;
  const touch = e.changedTouches[0];
  mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(muscleMeshes);
  if (selectedMesh) { resetMesh(selectedMesh); selectedMesh = null; }
  if (hits.length > 0) {
    selectedMesh = hits[0].object;
    highlightMesh(selectedMesh, 'select');
    showInfo(selectedMesh.userData.muscleKey);
  } else {
    hideInfo();
  }
  e.preventDefault();
}, { passive: false });

const particleCount = 280;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  positions[i * 3]     = (Math.random() - 0.5) * 12;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 12;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 12;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0x3366aa, size: 0.025, transparent: true, opacity: 0.35
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ════════════════════════════════════════════════════
//  GRID / FLOOR REFLECTION (subtle)
// ════════════════════════════════════════════════════
const gridHelper = new THREE.GridHelper(8, 20, 0x112244, 0x0d1a33);
gridHelper.position.y = -2.2;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.35;
scene.add(gridHelper);

// ════════════════════════════════════════════════════
//  ANIMATION LOOP
// ════════════════════════════════════════════════════
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;

  controls.update();

  // Gentle passive head bob (very subtle)
  headGroup.rotation.y = Math.sin(t * 0.3) * 0.008;

  // Particle drift
  particles.rotation.y += 0.0003;
  particles.rotation.x += 0.0001;

  renderer.render(scene, camera);
}

// ════════════════════════════════════════════════════
//  INIT — hide loading overlay
// ════════════════════════════════════════════════════
window.addEventListener('load', () => {
  animate();
  const loading = document.getElementById('loading');
  setTimeout(() => {
    loading.classList.add('fade-out');
    setTimeout(() => { loading.style.display = 'none'; }, 700);
  }, 900);
});

// Also animate immediately in case load already fired
animate();
setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('fade-out');
  setTimeout(() => { loading.style.display = 'none'; }, 700);
}, 1200);

</script>
</body>
</html>
